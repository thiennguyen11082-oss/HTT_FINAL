<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070A" />

    <title>HTT Marketing Agency — Premium Web Design in Phoenix, Arizona</title>
    <meta
      name="description"
      content="Premium websites, lead generation and local visibility for ambitious Phoenix businesses. Packages from $499. Free consultation, no obligation."
    />
    <link rel="canonical" href="https://httmarketing.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HTT Marketing Agency" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="HTT Marketing Agency — We build digital masterpieces." />
    <meta
      property="og:description"
      content="Premium websites, lead-generation systems, and local visibility for ambitious businesses. Phoenix, Arizona."
    />
    <meta property="og:url" content="https://httmarketing.com/" />
    <meta property="og:image" content="https://httmarketing.com/assets/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/assets/logo/logo-mark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/logo/logo-mark.png" />

    <!-- The hero cannot paint until these decode. -->
    <link rel="preload" as="image" href="/assets/projects/sutton.webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "HTT Marketing Agency",
        "description": "Premium website design, lead generation, and local visibility for ambitious businesses.",
        "url": "https://httmarketing.com",
        "email": "contact@httmarketing.com",
        "telephone": "+16239996330",
        "areaServed": "Phoenix, Arizona",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Phoenix",
          "addressRegion": "AZ",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://www.instagram.com/httmarketingagency/",
          "https://www.tiktok.com/@httmarketingagency"
        ],
        "priceRange": "$499 - $1799+",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Website packages",
          "itemListElement": [
            {
              "@type": "Offer",
              "name": "Starter",
              "price": "499",
              "priceCurrency": "USD",
              "description": "One page, up to six sections. Live in 7-10 business days."
            },
            {
              "@type": "Offer",
              "name": "Growth",
              "price": "999",
              "priceCurrency": "USD",
              "description": "Up to five pages with local SEO and Google Business Profile optimization."
            },
            {
              "@type": "Offer",
              "name": "Lead Engine",
              "price": "1799",
              "priceCurrency": "USD",
              "description": "Up to eight custom pages with booking, automation and conversion tracking."
            }
          ]
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How long does a website take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Starter websites typically take 7-10 business days. Multi-page and custom projects may take approximately 14 business days or longer, depending on features, revisions, and how quickly you provide content."
            }
          },
          {
            "@type": "Question",
            "name": "Are the displayed prices final?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The displayed prices are starting prices. Additional pages, premium software, special integrations, advanced booking systems, custom features, and urgent delivery may increase the final price."
            }
          },
          {
            "@type": "Question",
            "name": "Will the website work on mobile phones?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every website package includes mobile optimization for phones, tablets, laptops, and desktop computers. We design mobile-first rather than shrinking a desktop layout."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide support after launch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every project includes a monthly plan covering hosting, updates, monitoring, analytics, local SEO, and Google Business Profile support. Plans start at $29/mo and the tier is agreed with your quote."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
